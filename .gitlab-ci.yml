default:
  image: python:3.13-alpine
  tags:
    - veritas

pages:
  stage: deploy
  script:
  - mkdir -p xvamp
  - cd xvamp
  - git clone --depth 1 https://gitlab.dlr.de/veritas/veritas-shared/xvamp.git . || true
  - git checkout pages
  - git pull --depth 1
  - pip install --upgrade .[docs]
  - cd docsrc
  - make html
  - mv --update _build/html/* public
  artifacts:
    paths:
    - public
  only:
  - pages
