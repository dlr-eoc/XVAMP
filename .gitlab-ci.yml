# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  # https://pip.pypa.io/en/stable/topics/caching/
  cache:
    paths:
      - .cache/pip
  # set up environment
  before_script:
    - . ~sarlab/tools/Modules/init/bash
    - module source ~sarlab/tools/Modules/etc/initrc
    - echo "Gitlab-runner working directory $(pwd)"
    - module load python/3.12.2.el9.x86_64
    - which python3 ; python3 --version
    - python3 -m venv .venv
    - source .venv/bin/activate  
    - which python3 ; python3 --version
  tags:
    - veritas

pages:
  stage: deploy
  script:
  - python3 -m pip install --upgrade .[docs]
  - cd docsrc
  - make html
  - mv _build/html ../public
  artifacts:
    paths:
    - public
  rules:
    - if: $CI_COMMIT_BRANCH == "pages"
