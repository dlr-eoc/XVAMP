# define stages explicitly
stages:
  - deploy

# set pip cache to be outside the Docker volume
variables:
  PIP_CACHE_DIR: "/data-common/tmp/pip-cache/"

default:
  image: python:3.13
  tags:
    - mf-sar-dev

pages:
  stage: deploy
  script:
  - python --version
  - python -m venv .venv
  - source .venv/bin/activate
  - which python; python --version
  - python -m pip cache dir
  - python -m pip install --upgrade .[docs]
  - cd docsrc
  - make html
  - mv _build/html ../public
  artifacts:
    paths:
    - public
  only:
  - pages
