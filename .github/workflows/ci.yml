name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

defaults:
  run:
    shell: bash -el {0}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: xvamp
          channel-priority: strict
          conda-remove-defaults: "true"
          use-only-tar-bz2: true
          auto-activate-base: false

      - name: Get Date
        id: get-date
        run: echo "today=$(/bin/date -u '+%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Cache conda pkgs
        id: cache-pkgs
        uses: actions/cache@v5
        env:
          # Increase this value to reset cache if environment.yml has not changed
          CACHE_NUMBER: 0
        with:
          path: ~/conda_pkgs_dir
          key:
            ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{
            hashFiles('environment.yml') }}
      
      - name: Cache Conda env
        id: cache-env
        uses: actions/cache@v5
        env:
          # Increase this value to reset cache if environment.yml has not changed
          CACHE_NUMBER: 0
        with:
          path: ${{ env.CONDA }}/envs
          key:
            conda-${{ runner.os }}--${{ runner.arch }}--${{
            steps.get-date.outputs.today }}-${{
            hashFiles('environment.yml') }}-${{ env.CACHE_NUMBER  }}

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: environment.yml
          miniforge-version: latest
          activate-environment: xvamp
          channel-priority: strict
          conda-remove-defaults: "true"
          use-only-tar-bz2: true
          auto-activate-base: false
    
      - name: Update environment
        run:
          mamba env update -n xvamp -f environment.yml
        if: (steps.cache-env.outputs.cache-hit != 'true') || (steps.cache-pkgs.outputs.cache-hit != 'true')

      - name: Test conda
        run: |
          conda env list
          which python
          python --version

      - name: Install package in development mode
        run: |
          python -m pip install --no-deps --force-reinstall .

      - name: Run tests
        run: |
          python -m unittest -v

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: xvamp
          channel-priority: strict
          conda-remove-defaults: "true"
          use-only-tar-bz2: true
          auto-activate-base: false

      - name: Get Date
        id: get-date
        run: echo "today=$(/bin/date -u '+%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Cache conda pkgs
        id: cache-pkgs
        uses: actions/cache@v5
        env:
          # Increase this value to reset cache if environment.yml has not changed
          CACHE_NUMBER: 0
        with:
          path: ~/conda_pkgs_dir
          key:
            ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{
            hashFiles('environment.yml') }}
      
      - name: Cache Conda env
        id: cache-env
        uses: actions/cache@v5
        env:
          # Increase this value to reset cache if environment.yml has not changed
          CACHE_NUMBER: 0
        with:
          path: ${{ env.CONDA }}/envs
          key:
            conda-${{ runner.os }}--${{ runner.arch }}--${{
            steps.get-date.outputs.today }}-${{
            hashFiles('environment.yml') }}-${{ env.CACHE_NUMBER  }}

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: environment.yml
          miniforge-version: latest
          activate-environment: xvamp
          channel-priority: strict
          conda-remove-defaults: "true"
          use-only-tar-bz2: true
          auto-activate-base: false
    
      - name: Update environment
        run:
          mamba env update -n xvamp -f environment.yml
        if: (steps.cache-env.outputs.cache-hit != 'true') || (steps.cache-pkgs.outputs.cache-hit != 'true')

      - name: Test conda
        run: |
          conda env list
          which python
          python --version

      - name: Install package with docs dependencies
        run: |
          python -m pip install --no-deps --force-reinstall .[docs]

      - name: Build documentation
        run: |
          cd docsrc
          sphinx-build -M html . _build
          mv _build/html ../public

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: public/
          if-no-files-found: ignore
