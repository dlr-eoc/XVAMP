name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

defaults:
  run:
    shell: bash -el {0}

jobs:
  setup-conda:
    name: Set up Conda Environment
    runs-on: ubuntu-latest
    outputs:
      conda_prefix: ${{ steps.setup-env.outputs.prefix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: xvamp
          channel-priority: strict
          conda-remove-defaults: true
          use-only-tar-bz2: true
          auto-activate-base: false

      - name: Get Date
        id: get-date
        run: echo "today=$(date -u '+%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Cache conda pkgs
        id: cache-pkgs
        uses: actions/cache@v5
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}--conda--${{ hashFiles('environment.yml') }}
          restore-keys: |
            ${{ runner.os }}--conda--

      - name: Cache Conda env
        id: cache-env
        uses: actions/cache@v5
        with:
          path: ${{ env.CONDA }}/envs
          key: |
            conda-${{ runner.os }}--${{ runner.arch }}--${{ steps.get-date.outputs.today }}--${{ hashFiles('environment.yml') }}
          restore-keys: |
            conda-${{ runner.os }}--${{ runner.arch }}--

      - name: Set up environment
        id: setup-env
        run:
          mamba env update -n xvamp -f environment.yml
          echo "prefix=$(conda info --base)/envs/xvamp" >> $GITHUB_OUTPUT

      - name: Test conda setup
        run: |
          conda env list
          which python
          python --version

  test:
    name: Run Tests
    needs: setup-conda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Activate Conda Environment
        run: |
          eval "$(conda shell.bash hook)"
          conda activate ${{ needs.setup-conda.outputs.conda_prefix }}

      - name: Install package in development mode
        run: |
          python -m pip install --no-deps --force-reinstall .

      - name: Run tests
        run: |
          python -m unittest -v

  build-docs:
    name: Build Documentation
    needs: setup-conda
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Activate Conda Environment
        run: |
          eval "$(conda shell.bash hook)"
          conda activate ${{ needs.setup-conda.outputs.conda_prefix }}

      - name: Install package with docs dependencies
        run: |
          python -m pip install --no-deps --force-reinstall .[docs]

      - name: Build documentation
        run: |
          cd docsrc
          sphinx-build -M html . _build
          mv _build/html ../public

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: public/
          if-no-files-found: ignore
  